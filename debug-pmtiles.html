<!DOCTYPE html>
<html>
<head>
    <title>PMTiles Debug</title>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
</head>
<body>
    <div id="map" style="width: 100%; height: 400px;"></div>
    <div id="debug" style="padding: 20px;">
        <h3>Building Feature Properties</h3>
        <pre id="properties"></pre>
    </div>

    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <script src='https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js'></script>
    <script>
        // Set up PMTiles protocol
        let protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'nj-buildings': {
                        type: 'vector',
                        url: 'pmtiles://nj-complete.pmtiles'
                    }
                },
                layers: [
                    {
                        id: 'background',
                        type: 'background',
                        paint: { 'background-color': '#f0f0f0' }
                    },
                    {
                        id: 'buildings',
                        source: 'nj-buildings',
                        'source-layer': 'building',
                        type: 'fill',
                        paint: {
                            'fill-color': '#ff0000',
                            'fill-opacity': 0.5
                        }
                    }
                ]
            },
            center: [-74.5, 40.5],
            zoom: 14
        });

        map.on('load', () => {
            map.on('click', 'buildings', (e) => {
                const properties = e.features[0].properties;
                document.getElementById('properties').textContent = JSON.stringify(properties, null, 2);
                console.log('Building properties:', properties);
            });
        });
    </script>
</body>
</html>
