<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Earth Street War</title>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div id="ui-container">
        <h1 class="title">Real-Earth Street War</h1>
        <div id="controls">
            <button id="plant-hq-btn">Plant HQ</button>
            <button id="refresh-map-btn" title="Hard refresh">Refresh Map</button>
        </div>
        <div id="stats-panel">
            <p><strong>Buildings Controlled:</strong> <span id="building-count">0</span></p>
            <p><strong>Bank Balance:</strong> $<span id="bank-balance">0.00</span></p>
        </div>
        <div id="info-panel" class="hidden">
            <h2>Road Information</h2>
            <p><strong>Name:</strong> <span id="road-name"></span></p>
            <p><strong>Type:</strong> <span id="road-type"></span></p>
            <p><strong>ID:</strong> <span id="road-id"></span></p>
        </div>
    </div>

    <script src='https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.js'></script>
    <script src='https://unpkg.com/osmtogeojson@3.0.0-beta.4/osmtogeojson.js'></script>
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>
    <script src="script.js"></script>
</body>
</html>
