<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Earth Street War</title>
    <link href='libs/maplibre-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div id="ui-container">
        <h2 class="title">Crimespree Worldwide</h1>
        <div id="controls">
            <button id="plant-producer-btn">Place Farm</button>
            <button id="plant-trafficker-btn">Place Trafficker</button>
            <button id="plant-retailer-btn">Place Dealer</button>
        </div>
        <div id="stats-panel">
            <p><strong>HQs Placed:</strong> <span id="hq-count">0</span></p>
            <p><strong>Commodities:</strong> <span id="commodities-count">0</span></p>
            <p><strong>Money:</strong> $<span id="money-count">0</span></p>
            <p><strong>Date:</strong> <span id="game-date"></span></p>
        </div>
    </div>

    <script src='libs/maplibre-gl.js'></script>
    <script src='libs/pmtiles.js'></script>
    <script src='libs/osmtogeojson.js'></script>
    <script src='libs/turf.min.js'></script>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
