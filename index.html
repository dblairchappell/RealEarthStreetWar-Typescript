<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Earth Street War</title>
    <link href='libs/maplibre-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div id="ui-container">
        <h1 class="title">A New World</h1>
        <div id="controls">
            <button id="plant-hq-btn">Plant HQ</button>
            <button id="refresh-map-btn" title="Hard refresh">Refresh Map</button>
        </div>
        <div id="stats-panel">
            <p><strong>Buildings Controlled:</strong> <span id="building-count">0</span></p>
            <p><strong>Residents Controlled:</strong> <span id="resident-count">0</span></p>
            <p><strong>Bank Balance:</strong> $<span id="bank-balance">0.00</span></p>
            <p><strong>Date:</strong> <span id="game-date">1 Jan 2023</span></p>
            <p><strong>Gang Wage (per day):</strong> $<span id="wage-display">50</span></p>
            <input type="range" id="wage-slider" min="50" max="500" step="10" value="50">
            <p><strong>Gang Members:</strong> <span id="gang-count">0</span>/<span id="gang-max">10</span></p>
            
        </div>
        <div id="info-panel" class="hidden">
            <h2>Road Information</h2>
            <p><strong>Name:</strong> <span id="road-name"></span></p>
            <p><strong>Type:</strong> <span id="road-type"></span></p>
            <p><strong>ID:</strong> <span id="road-id"></span></p>
        </div>
    </div>

    <script src='libs/maplibre-gl.js'></script>
    <script src='libs/pmtiles.js'></script>
    <script src='libs/osmtogeojson.js'></script>
    <script src='libs/turf.min.js'></script>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
